<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jogar</title>
<style>html,body{margin:0;height:100%;background:#000;color:#eee;font-family:system-ui,sans-serif}
#bar{height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#14141c}
#bar a{color:#9a8cff;text-decoration:none}
#stage{height:calc(100% - 44px)}#stage iframe{width:100%;height:100%;border:0}
#pick{display:none;padding:32px;text-align:center}</style><script src="auth.js"></script></head><body>
<div id="bar"><a href="index.html">← Catálogo</a><span id="title"></span></div>
<div id="pick"><p>ROM não encontrada na pasta <code>roms/</code>.<br>Escolha o arquivo do seu computador:</p><input type="file" id="f"></div>
<div id="stage"></div>
<script>
const id=new URLSearchParams(location.search).get("id");
const stage=document.getElementById("stage"),pick=document.getElementById("pick");
function emu(g,url,name){
  pick.style.display="none";
  window.EJS_player="#stage";window.EJS_core=g.core;window.EJS_gameUrl=url;
  window.EJS_gameName=name.replace(/\.[^.]+$/,"");
  window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";window.EJS_startOnLoaded=true;
  const s=document.createElement("script");s.src=EJS_pathtodata+"loader.js";document.body.appendChild(s);
}
fetch("games.json").then(r=>r.json()).then(list=>{
  const g=list.find(x=>x.id===id);
  if(!g){stage.textContent="Jogo não encontrado.";return}
  document.title=g.title;document.getElementById("title").textContent=g.title;
  if(g.type==="html"){stage.innerHTML="";const i=document.createElement("iframe");i.src=g.path;i.allow="fullscreen;gamepad";stage.appendChild(i);return}
  fetch(g.path,{method:"HEAD"}).then(r=>r.ok?emu(g,g.path,g.path.split("/").pop()):Promise.reject())
   .catch(()=>{pick.style.display="block";document.getElementById("f").onchange=e=>{const f=e.target.files[0];if(f)emu(g,URL.createObjectURL(f),f.name)}});
});
</script></body></html>
