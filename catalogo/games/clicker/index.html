<!DOCTYPE html><meta charset="utf-8"><title>Clicker Demo</title>
<body style="margin:0;display:grid;place-items:center;height:100vh;background:#1b1b2f;color:#fff;font:24px system-ui">
<div style="text-align:center"><div id="n" style="font-size:64px">0</div>
<button id="b" style="font-size:28px;padding:16px 32px;border-radius:12px;border:0;cursor:pointer">Clique!</button></div>
<script>let c=0;b.onclick=()=>n.textContent=++c</script>
