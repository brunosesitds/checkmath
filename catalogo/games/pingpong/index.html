<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ping Pong Arcade</title><body style="margin:0;background:#101018;display:grid;place-items:center;height:100vh;color:#fff;font:16px system-ui;text-align:center"><div><canvas id="c" style="background:#1b1b2b;max-width:95vw;max-height:80vh" width="480" height="320"></canvas><div id="s"></div></div><script>const c=document.getElementById("c"),x=c.getContext("2d"),s=document.getElementById("s");
const W=480,H=320,k={};let p=130,a=130,b,pl=0,ai=0;
function serve(){b={x:W/2,y:H/2,vx:(Math.random()<.5?-1:1)*4,vy:Math.random()*4-2}}
addEventListener("keydown",e=>{k[e.key]=1;if(e.key.startsWith("Arrow"))e.preventDefault()});addEventListener("keyup",e=>k[e.key]=0);
c.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect();p=(e.clientY-r.top)*H/r.height-30});
function loop(){if(k.ArrowUp||k.w)p-=5;if(k.ArrowDown||k.s)p+=5;a+=Math.sign(b.y-(a+30))*3.2;
 p=Math.max(0,Math.min(H-60,p));a=Math.max(0,Math.min(H-60,a));b.x+=b.vx;b.y+=b.vy;if(b.y<4||b.y>H-4)b.vy*=-1;
 if(b.vx<0&&b.x<20&&b.x>8&&b.y>p&&b.y<p+60){b.vx*=-1.05;b.vy+=(b.y-p-30)/8}
 if(b.vx>0&&b.x>W-20&&b.x<W-8&&b.y>a&&b.y<a+60){b.vx*=-1.05;b.vy+=(b.y-a-30)/8}
 if(b.x<0){ai++;serve()}if(b.x>W){pl++;serve()}
 x.clearRect(0,0,W,H);x.fillStyle="#fff";x.fillRect(10,p,8,60);x.fillRect(W-18,a,8,60);x.fillRect(b.x-4,b.y-4,8,8);
 s.textContent="Você "+pl+" × "+ai+" PC — mouse ou setas";requestAnimationFrame(loop)}
serve();loop();
</script>
