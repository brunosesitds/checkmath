<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title><body style="margin:0;background:#101018;display:grid;place-items:center;height:100vh;color:#fff;font:16px system-ui;text-align:center"><div><canvas id="c" style="background:#1b1b2b;max-width:95vw;max-height:80vh" width="400" height="400"></canvas><div id="s"></div></div><script>const c=document.getElementById("c"),x=c.getContext("2d"),s=document.getElementById("s");
const N=20,T=20;let sn,d,nd,f,sc,over;
function reset(){sn=[{x:10,y:10}];d={x:1,y:0};nd=null;f={x:5,y:5};sc=0;over=false;s.textContent="Pontos: 0 — setas/WASD"}
addEventListener("keydown",e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
 if(m){e.preventDefault();if(m[0]!=-d.x||m[1]!=-d.y)nd={x:m[0],y:m[1]}}if(e.key==" "&&over)reset()});
function step(){if(over)return;if(nd)d=nd;nd=null;const h={x:sn[0].x+d.x,y:sn[0].y+d.y};
 if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(p=>p.x==h.x&&p.y==h.y)){over=true;s.textContent="Fim! Pontos: "+sc+" — espaço reinicia";return}
 sn.unshift(h);if(h.x==f.x&&h.y==f.y){sc++;s.textContent="Pontos: "+sc;f={x:Math.random()*N|0,y:Math.random()*N|0}}else sn.pop()}
function draw(){x.clearRect(0,0,400,400);x.fillStyle="#e33";x.fillRect(f.x*T,f.y*T,T-2,T-2);x.fillStyle="#4d4";sn.forEach(p=>x.fillRect(p.x*T,p.y*T,T-2,T-2))}
reset();setInterval(()=>{step();draw()},110);
</script>
